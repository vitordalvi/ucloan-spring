spring:
  application:
    name: ucloan

  config:
    import: "optional:file:./.env[.properties]"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 16

  flyway:
    enabled: true
    baseline-version: 1
    baseline-on-migrate: true

  threads:
    virtual:
      enabled: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 900000 # 15 minutes (stateless short-lived access token)
      refresh-token:
        expiration: 604800000 # 7 days (refresh token)

logging:
  level:
    org.springframework.security: WARN
